<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#B71C1C" />
  <title>ELETRICARLOS — Livro de Anotações</title>
  <meta name="description" content="Livro de anotações de manutenção — ELETRICARLOS." />

  <link rel="icon" href="assets/logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/logo.png" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://eletricarlos.netlify.app/" />
  <meta property="og:title" content="ELETRICARLOS — Livro de Anotações" />
  <meta property="og:description" content="Livro de anotações de manutenção — ELETRICARLOS." />
  <meta property="og:image" content="https://eletricarlos.netlify.app/assets/logo.png" />
  <meta property="og:image:alt" content="Logo ELETRICARLOS" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:site_name" content="ELETRICARLOS" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="ELETRICARLOS — Livro de Anotações" />
  <meta name="twitter:description" content="Livro de anotações de manutenção — ELETRICARLOS." />
  <meta name="twitter:image" content="https://eletricarlos.netlify.app/assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- HOME -->
  <section id="screen-home" class="screen active" aria-label="Início" aria-hidden="false">
    <header class="brand-hero">
      <img src="assets/logo.png" alt="ELETRICARLOS" class="logo" width="1024" height="664" decoding="async" />
      <p class="subtitle">Livro de Anotações</p>
    </header>
    <nav class="menu" aria-label="Estabelecimentos">
      <button type="button" class="btn-pill" data-local="Pousada Paraíso">Pousada Paraíso</button>
      <button type="button" class="btn-pill" data-local="Dorys Prime">Dorys Prime</button>
      <button type="button" class="btn-pill" data-local="Hotel JR">Hotel JR</button>
      <button type="button" class="btn-pill" data-local="Hotel Guarany">Hotel Guarany</button>
    </nav>
  </section>

  <!-- LOCAL -->
  <section id="screen-local" class="screen" aria-label="Tipos de manutenção" aria-hidden="true">
    <header class="top-bar">
      <button type="button" class="btn-back" id="btn-back-home" aria-label="Voltar ao início">←</button>
      <h1 id="local-title" class="page-title"></h1>
    </header>
    <nav class="menu" aria-label="Tipos">
      <button type="button" class="btn-pill" data-type="Manutenção Preventiva">Manutenção Preventiva</button>
      <button type="button" class="btn-pill" data-type="Manutenção Corretiva">Manutenção Corretiva</button>
      <button type="button" class="btn-pill" data-type="Observação">Observações</button>
    </nav>
  </section>

  <!-- FORM -->
  <section id="screen-form" class="screen" aria-label="Anotações" aria-hidden="true">
    <header class="top-bar">
      <button type="button" class="btn-back" id="btn-back-local" aria-label="Voltar aos tipos">←</button>
      <div class="page-title-wrap">
        <h1 id="form-local" class="page-title sm"></h1>
        <p id="form-type" class="page-caption"></p>
      </div>
    </header>

    <div class="filter-bar" role="search" aria-label="Filtrar anotações">
      <div class="filter-modes" role="group" aria-label="Tipo de filtro">
        <button type="button" class="filter-mode active" data-mode="ano" aria-pressed="true">Ano</button>
        <button type="button" class="filter-mode" data-mode="data" aria-pressed="false">Data</button>
        <button type="button" class="filter-mode" data-mode="numero" aria-pressed="false">Nº</button>
      </div>
      <div class="filter-row">
        <input
          type="search"
          id="filter-query"
          class="filter-input"
          placeholder="Ex.: 2024"
          autocomplete="off"
          inputmode="numeric"
          enterkeyhint="search"
        />
        <button type="button" id="filter-clear" class="filter-clear" hidden>Limpar</button>
      </div>
      <p id="filter-meta" class="filter-meta" hidden></p>
    </div>

    <div id="loading" class="loading" hidden>Carregando…</div>

    <div class="form-header-labels" aria-hidden="true">
      <span>Nº</span>
      <span>Data</span>
      <span>Anotação</span>
    </div>

    <div id="entries" class="entries"></div>
    <p id="filter-empty" class="filter-empty" hidden>Nenhuma anotação com esse filtro.</p>

    <div class="actions" role="toolbar" aria-label="Ações do formulário">
      <button type="button" id="btn-remove" class="btn-pill action" aria-label="Remover última linha">−</button>
      <button type="button" id="btn-add" class="btn-pill action" aria-label="Adicionar linha">+</button>
      <button type="button" id="btn-save" class="btn-pill action save">Salvar</button>
    </div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
