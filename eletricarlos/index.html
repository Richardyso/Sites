<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#B71C1C" />
  <title>ELÉTRICARLOS — Livro de Anotações</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="toast" class="toast" hidden></div>

  <!-- HOME -->
  <section id="screen-home" class="screen active">
    <header class="brand-hero">
      <img src="assets/logo.png" alt="ELÉTRICARLOS" class="logo" />
      <p class="subtitle">Livro de Anotações</p>
    </header>
    <nav class="menu" aria-label="Estabelecimentos">
      <button type="button" class="btn-pill" data-local="Pousada Paraíso">Pousada Paraíso</button>
      <button type="button" class="btn-pill" data-local="Dorys Prime">Dorys Prime</button>
      <button type="button" class="btn-pill" data-local="Hotel JR">Hotel JR</button>
      <button type="button" class="btn-pill" data-local="Hotel Guarany">Hotel Guarany</button>
    </nav>
  </section>

  <!-- LOCAL -->
  <section id="screen-local" class="screen">
    <header class="top-bar">
      <button type="button" class="btn-back" id="btn-back-home" aria-label="Voltar">←</button>
      <h1 id="local-title" class="page-title"></h1>
    </header>
    <nav class="menu" aria-label="Tipos">
      <button type="button" class="btn-pill" data-type="Manutenção Preventiva">Manutenção Preventiva</button>
      <button type="button" class="btn-pill" data-type="Manutenção Corretiva">Manutenção Corretiva</button>
      <button type="button" class="btn-pill" data-type="Observação">Observações</button>
    </nav>
  </section>

  <!-- FORM -->
  <section id="screen-form" class="screen">
    <header class="top-bar">
      <button type="button" class="btn-back" id="btn-back-local" aria-label="Voltar">←</button>
      <div class="page-title-wrap">
        <h1 id="form-local" class="page-title sm"></h1>
        <p id="form-type" class="page-caption"></p>
      </div>
    </header>

    <div id="loading" class="loading" hidden>Carregando…</div>

    <div class="form-header-labels" aria-hidden="true">
      <span>Nº</span>
      <span>Data</span>
      <span>Anotação</span>
    </div>

    <div id="entries" class="entries"></div>

    <div class="actions">
      <button type="button" id="btn-remove" class="btn-pill action">−</button>
      <button type="button" id="btn-add" class="btn-pill action">+</button>
      <button type="button" id="btn-save" class="btn-pill action save">Salvar</button>
    </div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
