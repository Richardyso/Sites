<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BibliaSaas – Leitor da Bíblia</title>
  <link rel="icon" type="image/png" href="assets/images/favico.png" id="favicon" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://bibliasaas.vercel.app/" />
  <meta property="og:image" content="https://bibliasaas.vercel.app/assets/images/og.png" />
  <meta property="og:title" content="BibliaSaas – Leitor da Bíblia" />
  <meta property="og:description" content="Leia a Bíblia online com múltiplas traduções. Escolha livro, capítulo e versículo." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://bibliasaas.vercel.app/" />
  <meta name="twitter:image" content="https://bibliasaas.vercel.app/assets/images/og.png" />
  <meta name="twitter:title" content="BibliaSaas – Leitor da Bíblia" />
  <meta name="twitter:description" content="Leia a Bíblia online com múltiplas traduções. Escolha livro, capítulo e versículo." />
  <link rel="stylesheet" href="assets/styles/variables.css" />
  <link rel="stylesheet" href="assets/styles/layout.css" />
  <link rel="stylesheet" href="assets/styles/components.css" />
  <link rel="stylesheet" href="assets/styles/theme.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <a href="index.html" class="header-logo" aria-label="BibliaSaas início">
        <img src="assets/images/favico.png" alt="" class="header-logo-icon" onerror="this.style.display='none'" />
        <span class="header-logo-text">BibliaSaas</span>
      </a>
      <div class="header-search-wrap">
        <label for="searchInput" class="sr-only">Pesquisar versículos por palavra</label>
        <input type="search" id="searchInput" class="header-search" placeholder="Pesquise versículos por palavra" aria-label="Pesquisar na Bíblia" />
      </div>
      <nav class="header-nav">
        <a href="pages/sobre.html" class="header-link">Sobre</a>
      </nav>
    </header>

    <div class="app-body">
      <aside class="sidebar">
        <h2 class="sidebar-title">Livros</h2>
        <div class="sidebar-fields">
          <div class="selector-group">
            <label for="bookSelect">Livro</label>
            <select id="bookSelect" class="select" aria-label="Selecionar livro">
              <option value="">Selecione o livro</option>
            </select>
          </div>
          <div class="selector-group">
            <label for="chapterSelect">Capítulo</label>
            <select id="chapterSelect" class="select" aria-label="Selecionar capítulo">
              <option value="">Selecione o capítulo</option>
            </select>
          </div>
          <div class="selector-group">
            <label for="verseInput">Versículo</label>
            <input type="number" id="verseInput" class="select verse-input" min="1" placeholder="Opcional" aria-label="Versículo opcional" />
          </div>
        </div>
        <fieldset class="sidebar-versions" id="translationsFieldset">
          <legend class="translations-legend">Versões</legend>
          <div class="translations-group" id="translationsGroup"></div>
          <p class="translations-empty-msg" id="translationsEmptyMsg" style="display: none;"></p>
        </fieldset>
        <button type="button" class="btn btn-primary btn-read" id="btnRead">Ler</button>
      </aside>

      <main class="main-content">
        <div class="main-toolbar">
          <div class="font-size-controls">
            <button type="button" class="btn btn-icon" id="fontSizeDown" aria-label="Diminuir fonte">A-</button>
            <button type="button" class="btn btn-icon" id="fontSizeUp" aria-label="Aumentar fonte">A+</button>
          </div>
          <button type="button" class="btn btn-icon theme-toggle" id="themeToggle" aria-label="Alternar modo escuro">
            <span class="icon-sun" aria-hidden="true">☀</span>
            <span class="icon-moon" aria-hidden="true">🌙</span>
          </button>
        </div>

        <section class="reading-section" id="readingSection" aria-live="polite">
          <p class="empty-msg" id="emptyMsg">Selecione livro e capítulo e clique em Ler. Opcional: versículo e versões (nenhuma marcada = todas).</p>
          <div id="loadingMsg" class="loading-msg" style="display: none;">Carregando…</div>
          <div id="errorMsg" class="error-msg" style="display: none;"></div>
          <div id="searchResults" class="search-results" style="display: none;"></div>
          <div id="readingContent" style="display: none;">
            <h2 class="reading-header" id="readingHeader"></h2>
            <div class="verses-stacked" id="versesStacked"></div>
            <div class="chapter-nav reading-inline-nav">
              <button type="button" class="btn btn-secondary" id="btnPrevChapter">Capítulo anterior</button>
              <button type="button" class="btn btn-secondary" id="btnNextChapter">Próximo capítulo</button>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="assets/scripts/app.js"></script>
</body>
</html>
