<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sobre – BibliaSaas</title>
  <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico" />
  <link rel="icon" type="image/png" href="../assets/images/favico.png" />
  <link rel="stylesheet" href="../assets/styles/variables.css" />
  <link rel="stylesheet" href="../assets/styles/layout.css" />
  <link rel="stylesheet" href="../assets/styles/components.css" />
  <link rel="stylesheet" href="../assets/styles/theme.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <a href="../index.html" class="header-logo">
        <img src="../assets/images/favico.png" alt="" class="header-logo-icon" onerror="this.style.display='none'" />
        <span class="header-logo-text">BibliaSaas</span>
      </a>
      <nav class="header-nav">
        <button type="button" class="btn btn-icon theme-toggle" id="themeToggle" aria-label="Alternar modo escuro">
          <span class="icon-sun" aria-hidden="true">☀</span>
          <span class="icon-moon" aria-hidden="true">🌙</span>
        </button>
        <a href="sobre.html" class="header-link">Sobre</a>
      </nav>
    </header>
    <main class="main-content" style="padding: 2rem;">
      <h1>Sobre</h1>
      <p>Conteúdo em branco por enquanto.</p>
    </main>
  </div>
  <script>
    (function () {
      function initTheme() {
        var dark = localStorage.getItem('bibliasaas-dark') === '1';
        document.body.classList.toggle('dark-mode', dark);
      }
      function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('bibliasaas-dark', document.body.classList.contains('dark-mode') ? '1' : '0');
      }
      initTheme();
      var btn = document.getElementById('themeToggle');
      if (btn) btn.addEventListener('click', toggleTheme);
    })();
  </script>
</body>
</html>
