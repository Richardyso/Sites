<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Metas - GlowMeClub</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/images/favico.png">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Minhas Metas - GlowMeClub">
    <meta property="og:description" content="Defina e acompanhe suas metas no GlowMeClub">
    <meta property="og:image" content="../assets/images/og.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/metas.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <nav class="app-nav">
            <a href="/" class="logo-link">
                <img src="../assets/images/glowmeclub.png" alt="GlowMeClub" class="logo-img">
            </a>
            
            <!-- Desktop Navigation -->
            <div class="desktop-nav">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="metas.html" class="nav-link active">Metas</a>
                <a href="missoes.html" class="nav-link">Missões</a>
                <a href="pontos.html" class="nav-link">Pontos</a>
                <a href="recompensas.html" class="nav-link">Recompensas</a>
            </div>
            
            <!-- User Area -->
            <div class="user-area">
                <a href="perfil.html" class="user-profile-link">
                    <div class="user-avatar" id="headerAvatar">
                        <span>U</span>
                    </div>
                    <span class="user-name" id="headerUserName">Usuário</span>
                </a>
                <button class="logout-btn" id="logoutBtn" title="Sair">
                    <i class="fas fa-sign-out-alt"></i>
                    <span class="logout-text">Sair</span>
                </button>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="main-container">
        <!-- Page Header -->
        <div class="page-header">
            <h1 class="page-title">Minhas Metas</h1>
            <p class="page-subtitle">Defina objetivos claros e acompanhe seu progresso</p>
        </div>

        <!-- Goals Grid -->
        <div class="goals-grid" id="goalsGrid">
            <!-- Metas serão carregadas dinamicamente -->
        </div>

        <!-- Empty State -->
        <div class="empty-goals" id="emptyState" style="display: none;">
            <span class="empty-icon">
                <i class="fas fa-bullseye"></i>
            </span>
            <h3>Nenhuma meta ainda</h3>
            <p>Comece criando sua primeira meta para acompanhar seu progresso!</p>
        </div>
    </main>

    <!-- Add Goal Button -->
    <button class="add-goal-btn" id="addGoalBtn" aria-label="Adicionar nova meta">
        <i class="fas fa-plus"></i>
    </button>

    <!-- Bottom Navigation (Mobile) -->
    <nav class="bottom-nav">
        <div class="bottom-nav-items">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-th-large"></i>
                <span>Dashboard</span>
            </a>
            <a href="metas.html" class="nav-item active">
                <i class="fas fa-bullseye"></i>
                <span>Metas</span>
            </a>
            <a href="missoes.html" class="nav-item">
                <i class="fas fa-star"></i>
                <span>Missões</span>
            </a>
            <a href="pontos.html" class="nav-item">
                <i class="fas fa-coins"></i>
                <span>Pontos</span>
            </a>
            <a href="recompensas.html" class="nav-item">
                <i class="fas fa-gift"></i>
                <span>Recompensas</span>
            </a>
        </div>
    </nav>

    <!-- Goal Modal -->
    <div class="modal" id="goalModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Nova Meta</h3>
                <button class="close-btn" id="closeModalBtn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <form id="goalForm">
                <div class="modal-body">
                    <!-- Título da Meta -->
                    <div class="form-group">
                        <label for="goalTitle" class="form-label">Título da meta</label>
                        <input 
                            type="text" 
                            id="goalTitle" 
                            class="form-input"
                            placeholder="Ex: Ler 2 livros este mês"
                            required
                        >
                    </div>

                    <!-- Descrição -->
                    <div class="form-group">
                        <label for="goalDescription" class="form-label">Descrição (opcional)</label>
                        <textarea 
                            id="goalDescription"
                            class="form-textarea"
                            placeholder="Detalhes sobre sua meta..."
                            rows="3"
                        ></textarea>
                    </div>

                    <!-- Meta -->
                    <div class="form-group">
                        <label for="goalTarget" class="form-label">Quanto tempo em horas vou me dedicar por dia</label>
                        <input 
                            type="number" 
                            id="goalTarget" 
                            class="form-input"
                            placeholder="Ex: 2"
                            min="1"
                            required
                        >
                    </div>

                    <!-- Prazo -->
                    <div class="form-group">
                        <label for="goalDeadline" class="form-label">Prazo</label>
                        <p class="form-hint">Quando você pretende terminar</p>
                        <input 
                            type="date" 
                            id="goalDeadline" 
                            class="form-input"
                            required
                        >
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancelGoalBtn">
                        Cancelar
                    </button>
                    <button type="submit" class="btn btn-primary">
                        Criar Meta
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/metas.js"></script>
    <script>
        // Template para criar cards de metas - acessível globalmente
        window.createGoalCard = function(goal) {
            const card = document.createElement('div');
            card.className = 'goal-card';
            card.dataset.goalId = goal.id;
            if (goal.completed) {
                card.classList.add('completed');
            }

            card.innerHTML = `
                <div class="goal-header">
                    <div class="goal-info">
                        <h3>${goal.title}</h3>
                        ${goal.description ? `<p class="goal-description">${goal.description}</p>` : ''}
                    </div>
                    <div class="goal-actions">
                        <button class="goal-action" data-action="delete" data-id="${goal.id}" title="Excluir">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
                
                <div class="goal-details">
                    <div class="goal-detail">
                        <i class="fas fa-clock"></i>
                        <span>${goal.target}h por dia</span>
                    </div>
                    <div class="goal-detail">
                        <i class="fas fa-calendar"></i>
                        <span>Prazo: ${formatDate(goal.deadline)}</span>
                    </div>
                </div>
                
                ${goal.completed ? `
                    <div class="goal-completed-badge">
                        <i class="fas fa-check-circle"></i>
                        <span>Meta Concluída! +50 pontos</span>
                    </div>
                ` : `
                    <button class="btn btn-complete-goal" data-action="toggle" data-id="${goal.id}">
                        <i class="fas fa-check"></i>
                        Concluir Meta (+50 pontos)
                    </button>
                `}
            `;

            return card;
        }

        // Formatar data
        function formatDate(dateString) {
            const date = new Date(dateString);
            const options = { day: '2-digit', month: 'short', year: 'numeric' };
            return date.toLocaleDateString('pt-BR', options);
        }

        // Event delegation para ações nos cards de metas
        document.addEventListener('click', function(e) {
            const target = e.target.closest('[data-action]');
            if (!target) return;
            
            const action = target.dataset.action;
            const goalId = target.dataset.id;
            
            if (action === 'toggle' && window.toggleGoal) {
                window.toggleGoal(goalId);
            } else if (action === 'delete' && window.deleteGoal) {
                window.deleteGoal(goalId);
            }
        });
    </script>
</body>
</html>
