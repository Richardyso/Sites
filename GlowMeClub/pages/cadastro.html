<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - GlowMeClub</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/images/favico.png">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Cadastro - GlowMeClub">
    <meta property="og:description" content="Crie sua conta no GlowMeClub e comece sua jornada">
    <meta property="og:image" content="../assets/images/og.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
    <link rel="stylesheet" href="../assets/css/cadastro.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <a href="../index.html" class="back-link">
        <i class="fas fa-arrow-left"></i>
        Voltar
    </a>
    
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-header">
                <h2>Entrar no GlowMeClub</h2>
                <p>Comece sua jornada de evolução pessoal</p>
            </div>
            
            <div class="auth-body">
                <form id="signupForm">
                    <!-- Nome -->
                    <div class="form-group">
                        <label for="name" class="form-label">Nome completo</label>
                        <input 
                            type="text" 
                            id="name" 
                            name="name" 
                            class="form-control" 
                            required
                            placeholder="Digite seu nome completo"
                        >
                    </div>
                    
                    <!-- Email -->
                    <div class="form-group">
                        <label for="email" class="form-label">Email</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-control" 
                            required
                            placeholder="seu@email.com"
                        >
                    </div>
                    
                    <!-- Senha -->
                    <div class="form-group">
                        <label for="password" class="form-label">Senha</label>
                        <div class="password-toggle">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="form-control" 
                                required
                                minlength="8"
                                placeholder="Mínimo 8 caracteres"
                            >
                            <button type="button" class="toggle-btn" data-toggle="password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Confirmar Senha -->
                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">Confirmar senha</label>
                        <div class="password-toggle">
                            <input 
                                type="password" 
                                id="confirmPassword" 
                                name="confirmPassword" 
                                class="form-control" 
                                required
                                minlength="8"
                                placeholder="Digite a senha novamente"
                            >
                            <button type="button" class="toggle-btn" data-toggle="confirmPassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Telefone (Obrigatório) -->
                    <div class="form-group">
                        <label for="phone" class="form-label">Telefone *</label>
                        <div class="phone-input-wrapper">
                            <input 
                                type="text" 
                                id="phoneDdi" 
                                name="phoneDdi" 
                                class="form-control phone-ddi-field"
                                value="+55"
                                placeholder="+55"
                                maxlength="5"
                            >
                            <input 
                                type="tel" 
                                id="phone" 
                                name="phone" 
                                class="form-control phone-field" 
                                required
                                placeholder="(11) 99999-9999"
                                maxlength="15"
                            >
                        </div>
                        <span class="form-text">DDI padrão: +55 (Brasil). Formato: (DDD) 9XXXX-XXXX</span>
                    </div>
                    
                    <!-- Cor Preferida -->
                    <div class="form-group">
                        <label class="form-label">Cor preferida</label>
                        <div class="color-picker color-picker-3x3">
                            <!-- Cores Primárias -->
                            <div class="color-option" style="background: #EF4444" data-color="#EF4444" title="Vermelho"></div>
                            <div class="color-option" style="background: #3B82F6" data-color="#3B82F6" title="Azul"></div>
                            <div class="color-option" style="background: #EAB308" data-color="#EAB308" title="Amarelo"></div>
                            <!-- Cores Secundárias -->
                            <div class="color-option" style="background: #F97316" data-color="#F97316" title="Laranja"></div>
                            <div class="color-option" style="background: #22C55E" data-color="#22C55E" title="Verde"></div>
                            <div class="color-option selected" style="background: #8B5CF6" data-color="#8B5CF6" title="Roxo"></div>
                            <!-- Tons Neutros -->
                            <div class="color-option" style="background: #6B7280" data-color="#6B7280" title="Cinza"></div>
                            <div class="color-option" style="background: #D4A574" data-color="#D4A574" title="Bege"></div>
                            <div class="color-option" style="background: #EC4899" data-color="#EC4899" title="Rosa"></div>
                        </div>
                        <input type="hidden" id="preferredColor" name="preferredColor" value="#8B5CF6">
                    </div>
                    
                    <!-- Área de Foco -->
                    <div class="form-group">
                        <label for="focusArea" class="form-label">Área de foco principal</label>
                        <select id="focusArea" name="focusArea" class="form-control" required>
                            <option value="">Selecione uma área</option>
                            <option value="Mental">🧠 Mental</option>
                            <option value="Físico">💪 Físico</option>
                            <option value="Emocional">💗 Emocional</option>
                            <option value="Espiritual">🕊️ Espiritual</option>
                            <option value="Financeiro">💰 Financeiro</option>
                            <option value="Aparência">✨ Aparência</option>
                        </select>
                    </div>
                    
                    <!-- Mensagem de erro -->
                    <div id="errorMessage" class="error-message" style="display: none;"></div>
                    
                    <!-- Mensagem de sucesso -->
                    <div id="successMessage" class="success-message" style="display: none;"></div>
                    
                    <!-- Botão de cadastro -->
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">
                            <span>Entrar no GlowMeClub</span>
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                </form>
                
                <!-- Divider -->
                <div class="divider">
                    <span>ou cadastre-se com</span>
                </div>

                <!-- Login com Google -->
                <button id="googleLoginBtn" class="btn-google">
                    <i class="fab fa-google"></i>
                    Continuar com Google
                </button>
            </div>
            
            <div class="auth-footer">
                <p>Já tem uma conta?</p>
                <a href="login.html">Faça login</a>
            </div>
        </div>
    </div>
    
    <!-- Firebase SDK (para OAuth com Google) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    
    <!-- Scripts -->
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/firebase-config.js"></script>
    <script src="../assets/js/auth.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Seletor de cor
            document.querySelectorAll('.color-option').forEach(option => {
                option.addEventListener('click', function() {
                    document.querySelectorAll('.color-option').forEach(opt => opt.classList.remove('selected'));
                    this.classList.add('selected');
                    document.getElementById('preferredColor').value = this.dataset.color;
                });
            });
            
            // Toggle senha - usando data attributes
            document.querySelectorAll('.toggle-btn[data-toggle]').forEach(button => {
                button.addEventListener('click', function() {
                    const fieldId = this.dataset.toggle;
                    const field = document.getElementById(fieldId);
                    const icon = this.querySelector('i');
                    
                    if (field.type === 'password') {
                        field.type = 'text';
                        icon.classList.remove('fa-eye');
                        icon.classList.add('fa-eye-slash');
                    } else {
                        field.type = 'password';
                        icon.classList.remove('fa-eye-slash');
                        icon.classList.add('fa-eye');
                    }
                });
            });
        });
    </script>
</body>
</html>
