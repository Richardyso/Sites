<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>K0v1l Stego</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="frame">
    <img class="hero" src="assets/kovil.jpg" alt="K0v1l" />
    <h1>STEGO DO K0V1L</h1>
    <div class="ver">Ztegonography · StegOnline LSB · 1024</div>

    <div class="row">
      <span class="label">IMAGE</span>
      <label class="file-btn">
        SELECT
        <input type="file" id="fileInput" accept="image/*" />
      </label>
      <span id="fileName">assets/kovil.jpg</span>
    </div>

    <textarea id="msgArea" spellcheck="false" placeholder="mensagem…"></textarea>

    <div class="actions">
      <button class="primary" id="encodeBtn">ENCODE</button>
      <button class="primary" id="decodeBtn">DECODE</button>
    </div>

    <div id="status"></div>
    <canvas id="preview" width="1024" height="1024"></canvas>

    <footer class="social">
      <a class="social-link" href="https://www.instagram.com/luizfernandoziron/" target="_blank" rel="noopener noreferrer">
        <img src="https://cdn.simpleicons.org/instagram/39ff14" alt="" width="18" height="18" />
        <span>@luizfernandoziron</span>
      </a>
      <a class="social-link" href="https://www.youtube.com/@KovilBin%C3%A1rio" target="_blank" rel="noopener noreferrer">
        <img src="https://cdn.simpleicons.org/youtube/39ff14" alt="" width="18" height="18" />
        <span>@KovilBinário</span>
      </a>
      <a class="social-link" href="https://www.threads.com/@luizfernandoziron" target="_blank" rel="noopener noreferrer">
        <img src="https://cdn.simpleicons.org/threads/39ff14" alt="" width="18" height="18" />
        <span>@luizfernandoziron</span>
      </a>
    </footer>
  </div>

  <script src="assets/js/app.js" defer></script>
</body>
</html>
