<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GlowMeClub</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/images/favico.png">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Login - GlowMeClub">
    <meta property="og:description" content="Entre na sua conta GlowMeClub">
    <meta property="og:image" content="../assets/images/og.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-page">
    <!-- Volta ao início -->
    <a href="/" class="back-link">
        <i class="fas fa-arrow-left"></i>
        Voltar ao início
    </a>
    
    <div class="auth-container">
        <div class="auth-header">
            <h2>Bem-vinda de volta!</h2>
            <p>Entre na sua conta para continuar seu glow</p>
        </div>
        
        <div class="auth-body">
            <form id="loginForm">
                <!-- Email -->
                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-control" 
                        required
                        placeholder="seu@email.com"
                    >
                </div>

                <!-- Senha -->
                <div class="form-group">
                    <label for="password" class="form-label">Senha</label>
                    <div class="password-toggle">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-control" 
                            required
                            placeholder="••••••••"
                        >
                        <button type="button" class="toggle-btn" id="togglePasswordBtn">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Esqueceu senha -->
                <div style="text-align: right; margin-bottom: 1rem;">
                    <a href="redefinir-senha.html" class="forgot-password">
                        Esqueceu sua senha?
                    </a>
                </div>

                <!-- Mensagem de Erro -->
                <div id="errorMessage" class="error-message" style="display: none;"></div>

                <!-- Botão de Login -->
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                        Entrar
                    </button>
                </div>
            </form>

            <!-- Divider -->
            <div class="divider">
                <span>ou continue com</span>
            </div>

            <!-- Login com Google -->
            <button id="googleLoginBtn" class="btn-google">
                <i class="fab fa-google"></i>
                Google
            </button>
        </div>

        <!-- Footer -->
        <div class="auth-footer">
            <p>Ainda não tem uma conta?</p>
            <a href="cadastro.html" class="btn btn-outline btn-sm">
                Criar conta gratuita
            </a>
        </div>
    </div>

    <!-- Scripts -->
    <!-- Autenticação Local (sem Firebase) -->
    <!-- Scripts -->
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    
    <!-- Funções auxiliares -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Toggle Password
            const togglePasswordBtn = document.getElementById('togglePasswordBtn');
            if (togglePasswordBtn) {
                togglePasswordBtn.addEventListener('click', function() {
                    const field = document.getElementById('password');
                    const icon = this.querySelector('i');
                    
                    if (field.type === 'password') {
                        field.type = 'text';
                        icon.classList.remove('fa-eye');
                        icon.classList.add('fa-eye-slash');
                    } else {
                        field.type = 'password';
                        icon.classList.remove('fa-eye-slash');
                        icon.classList.add('fa-eye');
                    }
                });
            }
        });
    </script>
</body>
</html>
